name: Feature request
description: Suggest something MeterX should measure, show or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first; a solution is welcome but optional.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
